# Test Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=validate

# Test Datasource Configuration with Fallbacks
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=
app.jwt.expirationMs=3600000

# Environment Configuration Import (.env)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:../../.env[.properties]

# Test Mail Configuration with Fallbacks
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_PASSWORD:testpassword}
spring.mail.properties.mail.smtp.from=${MAIL_FROM:test@example.com}
app.mail.from=${MAIL_FROM:test@example.com}
app.mail.from-name=${MAIL_FROM_NAME:E-Commerce App}
